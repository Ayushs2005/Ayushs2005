name: Sync Activity & Profile Signal Telemetry

on:
  schedule:
    # Run every 6 hours automatically
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/scripts/**'
      - '.github/workflows/update-telemetry.yml'

permissions:
  contents: write

jobs:
  sync-telemetry:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch Live GitHub Metrics & Update SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python .github/scripts/update_telemetry.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add Assets/activity-telemetry-full.svg
          if ! git diff --staged --quiet; then
            git commit -m "chore(telemetry): auto-sync activity & profile signal stats [skip ci]"
            git pull --rebase origin main
            git push origin main
          else
            echo "Activity telemetry SVG is already up to date."
          fi
