<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 180" width="100%" height="100%">
  <defs>
    <linearGradient id="fpBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080507" />
      <stop offset="100%" stop-color="#140609" />
    </linearGradient>
    <linearGradient id="fpBrd" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a0404" />
      <stop offset="50%" stop-color="#8b111a" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#240205" />
    </linearGradient>
    <style>
      .mono { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Mono', Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    </style>
  </defs>

  <rect width="850" height="180" rx="8" fill="url(#fpBg)" />
  <rect x="1" y="1" width="848" height="178" rx="7" fill="none" stroke="url(#fpBrd)" stroke-width="1.2" />

  <!-- Header -->
  <g transform="translate(26, 26)">
    <circle cx="4" cy="4" r="4" fill="#8b111a" />
    <text x="18" y="8" fill="#e8dadc" font-size="13" font-weight="700" class="mono" letter-spacing="0.12em">ACTIVE FOOTPRINT // SDET-1 @ INFINITE LOCUS</text>
    <rect x="680" y="-6" width="118" height="20" rx="4" fill="#260306" stroke="#4a0404" stroke-width="0.8" />
    <text x="739" y="8" fill="#a8898c" font-size="9.5" font-weight="600" class="mono" text-anchor="middle">PRIMARY FOCUS</text>
    <line x1="0" y1="20" x2="800" y2="20" stroke="#2b0306" stroke-width="1" />
  </g>

  <!-- Key Pillars Grid -->
  <g transform="translate(26, 68)">
    <!-- Pillar 1: Playwright Test Automation -->
    <g transform="translate(0, 0)">
      <rect width="190" height="85" rx="6" fill="#120406" stroke="#3d0306" stroke-width="1" />
      <text x="14" y="22" fill="#d9cbce" font-size="11.5" font-weight="700" class="sans">Playwright E2E Automation</text>
      <text x="14" y="42" fill="#8f7c7f" font-size="10" class="mono">Architecting resilient UI</text>
      <text x="14" y="58" fill="#8f7c7f" font-size="10" class="mono">&amp; workflow test harnesses</text>
      <text x="14" y="74" fill="#660000" font-size="9" font-weight="700" class="mono">ZERO FLAKINESS TOLERANCE</text>
    </g>

    <!-- Pillar 2: REST API & Contract Validation -->
    <g transform="translate(202, 0)">
      <rect width="190" height="85" rx="6" fill="#120406" stroke="#3d0306" stroke-width="1" />
      <text x="14" y="22" fill="#d9cbce" font-size="11.5" font-weight="700" class="sans">REST API Validation</text>
      <text x="14" y="42" fill="#8f7c7f" font-size="10" class="mono">Deep schema inspection,</text>
      <text x="14" y="58" fill="#8f7c7f" font-size="10" class="mono">payload security &amp; speed</text>
      <text x="14" y="74" fill="#660000" font-size="9" font-weight="700" class="mono">SYSTEMATIC COVERAGE</text>
    </g>

    <!-- Pillar 3: MongoDB Integrity & Verification -->
    <g transform="translate(404, 0)">
      <rect width="190" height="85" rx="6" fill="#120406" stroke="#3d0306" stroke-width="1" />
      <text x="14" y="22" fill="#d9cbce" font-size="11.5" font-weight="700" class="sans">MongoDB Validation</text>
      <text x="14" y="42" fill="#8f7c7f" font-size="10" class="mono">Document state fidelity &amp;</text>
      <text x="14" y="58" fill="#8f7c7f" font-size="10" class="mono">backend data consistency</text>
      <text x="14" y="74" fill="#660000" font-size="9" font-weight="700" class="mono">DATA INTEGRITY GATES</text>
    </g>

    <!-- Pillar 4: CI/CD & Release Readiness -->
    <g transform="translate(606, 0)">
      <rect width="190" height="85" rx="6" fill="#120406" stroke="#3d0306" stroke-width="1" />
      <text x="14" y="22" fill="#d9cbce" font-size="11.5" font-weight="700" class="sans">CI/CD &amp; Release Readiness</text>
      <text x="14" y="42" fill="#8f7c7f" font-size="10" class="mono">Automated pipeline gates &amp;</text>
      <text x="14" y="58" fill="#8f7c7f" font-size="10" class="mono">pre-production signoffs</text>
      <text x="14" y="74" fill="#660000" font-size="9" font-weight="700" class="mono">CONTINUOUS QUALITY</text>
    </g>
  </g>
</svg>
