<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Dark Atmospheric Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040406" />
      <stop offset="40%" stop-color="#0a0709" />
      <stop offset="80%" stop-color="#140608" />
      <stop offset="100%" stop-color="#050304" />
    </linearGradient>

    <radialGradient id="bloodGlow" cx="20%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#660000" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#3b0005" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="spiderGlow" cx="88%" cy="15%" r="35%">
      <stop offset="0%" stop-color="#8b111a" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f0ecec" />
      <stop offset="100%" stop-color="#d4b2b6" />
    </linearGradient>

    <linearGradient id="crimsonBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a0404" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#8b111a" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#2b0305" stop-opacity="0.8" />
    </linearGradient>

    <!-- Subtle Web Pattern -->
    <pattern id="webPattern" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M 0,50 Q 25,55 50,50 Q 75,45 100,50" fill="none" stroke="#660000" stroke-width="0.3" stroke-opacity="0.18" />
      <path d="M 50,0 Q 55,25 50,50 Q 45,75 50,100" fill="none" stroke="#660000" stroke-width="0.3" stroke-opacity="0.18" />
      <circle cx="50" cy="50" r="30" fill="none" stroke="#4a0005" stroke-width="0.25" stroke-opacity="0.15" />
      <line x1="0" y1="0" x2="100" y2="100" stroke="#330003" stroke-width="0.2" stroke-opacity="0.12" />
      <line x1="100" y1="0" x2="0" y2="100" stroke="#330003" stroke-width="0.2" stroke-opacity="0.12" />
    </pattern>

    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.8" />
    </filter>

    <style>
      @keyframes floatSpider {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(12px) rotate(-1.5deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.25; }
        50% { opacity: 0.4; }
      }
      @keyframes threadTension {
        0%, 100% { stroke-dashoffset: 0; }
        50% { stroke-dashoffset: 5; }
      }
      .spider-group {
        animation: floatSpider 8s ease-in-out infinite;
        transform-origin: 1040px 0px;
      }
      .glow-pulse {
        animation: pulseGlow 6s ease-in-out infinite;
      }
      .thread {
        stroke-dasharray: 200;
        animation: threadTension 8s ease-in-out infinite;
      }
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 900;
        letter-spacing: 0.18em;
      }
      .sub-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Mono', Consolas, monospace;
        font-weight: 500;
        letter-spacing: 0.25em;
      }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="420" fill="url(#bgGrad)" rx="12" />
  <rect width="1200" height="420" fill="url(#webPattern)" rx="12" />
  
  <!-- Atmospheric Glow Overlays -->
  <rect width="1200" height="420" fill="url(#bloodGlow)" class="glow-pulse" rx="12" />
  <rect width="1200" height="420" fill="url(#spiderGlow)" rx="12" />

  <!-- Frame Border -->
  <rect x="1.5" y="1.5" width="1197" height="417" rx="11" fill="none" stroke="url(#crimsonBorder)" stroke-width="1.5" />

  <!-- Corner Tech Brackets -->
  <path d="M 20 40 L 20 20 L 40 20" fill="none" stroke="#8b111a" stroke-width="2" stroke-opacity="0.7" />
  <path d="M 1180 40 L 1180 20 L 1160 20" fill="none" stroke="#8b111a" stroke-width="2" stroke-opacity="0.7" />
  <path d="M 20 380 L 20 400 L 40 400" fill="none" stroke="#8b111a" stroke-width="2" stroke-opacity="0.7" />
  <path d="M 1180 380 L 1180 400 L 1160 400" fill="none" stroke="#8b111a" stroke-width="2" stroke-opacity="0.7" />

  <!-- Ambient Spiderweb in Top Left -->
  <g opacity="0.25" transform="translate(10, 10)">
    <path d="M 0 0 L 140 30 M 0 0 L 110 80 M 0 0 L 70 130 M 0 0 L 20 160" stroke="#8b111a" stroke-width="0.8" fill="none" />
    <path d="M 40 10 Q 30 25 10 40" stroke="#8b111a" stroke-width="0.6" fill="none" />
    <path d="M 80 18 Q 65 45 20 80" stroke="#8b111a" stroke-width="0.6" fill="none" />
    <path d="M 120 26 Q 95 65 30 120" stroke="#8b111a" stroke-width="0.6" fill="none" />
  </g>

  <!-- Left Anime Silhouette / Getsuga Atmosphere -->
  <g transform="translate(30, 20)" opacity="0.45" filter="url(#subtleShadow)">
    <!-- Dark Aura Tendrils -->
    <path d="M 90 380 C 60 280, 140 180, 120 80 C 110 40, 70 20, 50 10 C 60 40, 50 90, 30 140 C 10 190, 40 280, 20 380 Z" fill="#4a0404" opacity="0.4" />
    <path d="M 160 380 C 130 250, 200 170, 170 90 C 150 50, 120 30, 90 20 C 120 60, 110 120, 90 180 C 70 240, 120 310, 100 380 Z" fill="#660000" opacity="0.35" />
    
    <!-- Flowing Hair / Getsuga Blades Silhouette -->
    <path d="M 110 380 L 140 240 L 190 150 L 175 190 L 230 120 L 205 170 L 270 110 L 225 185 L 290 160 L 235 220 L 260 290 L 210 380 Z" fill="#1a0407" />
    <path d="M 130 380 L 155 260 L 195 180 L 185 210 L 230 150 L 215 190 L 265 140 L 230 200 L 250 260 L 200 380 Z" fill="#2d050c" opacity="0.8" />
    <!-- Subtle Crimson Edge -->
    <path d="M 190 150 L 230 120 L 270 110 L 290 160" stroke="#8b111a" stroke-width="1.2" fill="none" opacity="0.6" />
  </g>

  <!-- Central Typography / Developer Identity -->
  <g transform="translate(600, 170)" text-anchor="middle">
    <!-- Status Telemetry Tag -->
    <g transform="translate(0, -75)">
      <rect x="-170" y="-14" width="340" height="28" rx="14" fill="#120608" stroke="#4a0404" stroke-width="1" />
      <circle cx="-145" cy="0" r="4" fill="#8b111a">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2.5s" repeatCount="indefinite" />
      </circle>
      <text x="5" y="4" fill="#a89a9c" font-size="11" class="sub-text" font-weight="600">SYSTEM STATUS: ELEVATED</text>
    </g>

    <!-- Main Name -->
    <text x="0" y="30" fill="url(#textGrad)" font-size="56" class="title-text" filter="url(#subtleShadow)">AYUSH SHARMA</text>
    
    <!-- Accent Line with Web Intersect -->
    <g transform="translate(0, 52)">
      <line x1="-280" y1="0" x2="-30" y2="0" stroke="#4a0404" stroke-width="1.5" />
      <line x1="30" y1="0" x2="280" y2="0" stroke="#4a0404" stroke-width="1.5" />
      <polygon points="0,-4 4,0 0,4 -4,0" fill="#8b111a" />
      <circle cx="0" cy="0" r="10" fill="none" stroke="#660000" stroke-width="0.8" opacity="0.6" />
      <line x1="-15" y1="0" x2="15" y2="0" stroke="#8b111a" stroke-width="1" />
    </g>

    <!-- Subtitle / Professional Domain -->
    <text x="0" y="86" fill="#b3a5a7" font-size="14" class="sub-text">CLOUD ARCHITECTURE • SDET • TEST AUTOMATION</text>
    <text x="0" y="112" fill="#756769" font-size="11.5" class="sub-text">DISTRIBUTED SYSTEMS • RESILIENCE • CI/CD QUALITY GATES</text>
  </g>

  <!-- Top Right Spider with Suspension Thread -->
  <g class="spider-group" transform="translate(1040, 0)">
    <!-- Silk Thread -->
    <line x1="0" y1="0" x2="0" y2="120" stroke="#660000" stroke-width="0.9" opacity="0.6" class="thread" />
    <line x1="0" y1="0" x2="0" y2="120" stroke="#a31924" stroke-width="0.3" opacity="0.4" />

    <!-- Spider Body & Legs -->
    <g transform="translate(0, 120)">
      <!-- Faint spider ambient halo -->
      <circle cx="0" cy="0" r="18" fill="#4a0005" opacity="0.25" />

      <!-- Legs (Right Side) -->
      <path d="M 2 -4 Q 14 -16 22 -10 Q 28 -5 26 8" fill="none" stroke="#8b111a" stroke-width="1.2" stroke-linecap="round" />
      <path d="M 3 -1 Q 18 -8 26 2 Q 30 10 24 20" fill="none" stroke="#660000" stroke-width="1.2" stroke-linecap="round" />
      <path d="M 3 2 Q 16 8 24 18 Q 28 26 20 32" fill="none" stroke="#8b111a" stroke-width="1.2" stroke-linecap="round" />
      <path d="M 2 5 Q 12 16 16 28 Q 18 36 12 42" fill="none" stroke="#4a0404" stroke-width="1.1" stroke-linecap="round" />

      <!-- Legs (Left Side) -->
      <path d="M -2 -4 Q -14 -16 -22 -10 Q -28 -5 -26 8" fill="none" stroke="#8b111a" stroke-width="1.2" stroke-linecap="round" />
      <path d="M -3 -1 Q -18 -8 -26 2 Q -30 10 -24 20" fill="none" stroke="#660000" stroke-width="1.2" stroke-linecap="round" />
      <path d="M -3 2 Q -16 8 -24 18 Q -28 26 -20 32" fill="none" stroke="#8b111a" stroke-width="1.2" stroke-linecap="round" />
      <path d="M -2 5 Q -12 16 -16 28 Q -18 36 -12 42" fill="none" stroke="#4a0404" stroke-width="1.1" stroke-linecap="round" />

      <!-- Cephalothorax (Head) -->
      <ellipse cx="0" cy="-3" rx="4.5" ry="4" fill="#1f0407" stroke="#4a0404" stroke-width="0.8" />
      <!-- Abdomen -->
      <ellipse cx="0" cy="7" rx="7" ry="9.5" fill="#150204" stroke="#660000" stroke-width="1" />
      <!-- Hourglass / Marking Accent (Dark Crimson, NOT neon) -->
      <polygon points="0,3 3,7 0,8 -3,7" fill="#8b111a" opacity="0.85" />
      <polygon points="0,11 3,7 0,8 -3,7" fill="#8b111a" opacity="0.85" />
    </g>
  </g>

  <!-- Bottom Visual Anchor Grid -->
  <g transform="translate(600, 390)" opacity="0.5">
    <circle cx="-120" cy="0" r="1.5" fill="#8b111a" />
    <circle cx="-60" cy="0" r="1.5" fill="#660000" />
    <circle cx="0" cy="0" r="2" fill="#8b111a" />
    <circle cx="60" cy="0" r="1.5" fill="#660000" />
    <circle cx="120" cy="0" r="1.5" fill="#8b111a" />
  </g>
</svg>
