<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 160" width="100%" height="100%">
  <defs>
    <linearGradient id="vBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080507" />
      <stop offset="100%" stop-color="#120508" />
    </linearGradient>
    <linearGradient id="vBrd" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a0404" />
      <stop offset="50%" stop-color="#8b111a" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#240205" />
    </linearGradient>
    <radialGradient id="certGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b111a" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <style>
      .mono { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Mono', Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    </style>
  </defs>

  <rect width="850" height="160" rx="8" fill="url(#vBg)" />
  <rect x="1" y="1" width="848" height="158" rx="7" fill="none" stroke="url(#vBrd)" stroke-width="1.2" />

  <!-- Credential 1: Microsoft Azure AZ-104 -->
  <g transform="translate(30, 20)">
    <!-- Shield / Badge Icon -->
    <circle cx="28" cy="60" r="30" fill="url(#certGlow)" />
    <g transform="translate(13, 40)">
      <polygon points="15,0 30,8 30,26 15,36 0,26 0,8" fill="#180407" stroke="#8b111a" stroke-width="1.5" />
      <!-- Inner checkmark / key -->
      <path d="M 9 18 L 13 22 L 21 14" fill="none" stroke="#d4b2b6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Details -->
    <g transform="translate(68, 36)">
      <rect x="0" y="-18" width="130" height="18" rx="3" fill="#240306" />
      <text x="6" y="-5" fill="#a8898c" font-size="9" font-weight="700" class="mono">MICROSOFT CERTIFIED</text>
      <text x="0" y="16" fill="#ffffff" font-size="14.5" font-weight="700" class="sans">Azure Administrator Associate</text>
      <text x="0" y="34" fill="#a89a9c" font-size="11.5" class="mono">EXAM AZ-104 · CLOUD INFRASTRUCTURE &amp; SECURITY</text>
      <text x="0" y="52" fill="#665053" font-size="10" class="mono">VERIFIED TECHNICAL CREDENTIAL</text>
    </g>
  </g>

  <!-- Vertical Divider -->
  <line x1="430" y1="25" x2="430" y2="135" stroke="#330307" stroke-width="1.2" stroke-dasharray="4 3" />

  <!-- Credential 2: AWS Academy Cloud Fundamentals -->
  <g transform="translate(455, 20)">
    <!-- Shield / Badge Icon -->
    <circle cx="28" cy="60" r="30" fill="url(#certGlow)" />
    <g transform="translate(13, 40)">
      <polygon points="15,0 30,8 30,26 15,36 0,26 0,8" fill="#180407" stroke="#8b111a" stroke-width="1.5" />
      <!-- Inner checkmark / key -->
      <path d="M 9 18 L 13 22 L 21 14" fill="none" stroke="#d4b2b6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Details -->
    <g transform="translate(68, 36)">
      <rect x="0" y="-18" width="145" height="18" rx="3" fill="#240306" />
      <text x="6" y="-5" fill="#a8898c" font-size="9" font-weight="700" class="mono">AMAZON WEB SERVICES</text>
      <text x="0" y="16" fill="#ffffff" font-size="14.5" font-weight="700" class="sans">AWS Cloud Fundamentals</text>
      <text x="0" y="34" fill="#a89a9c" font-size="11.5" class="mono">AWS ACADEMY · SERVERLESS &amp; ARCHITECTURE</text>
      <text x="0" y="52" fill="#665053" font-size="10" class="mono">VERIFIED TECHNICAL CREDENTIAL</text>
    </g>
  </g>
</svg>
