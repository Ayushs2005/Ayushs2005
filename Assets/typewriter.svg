<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 60" width="100%" height="60">
  <defs>
    <style>
      .mono-text {
        font-family: 'JetBrains Mono', 'SF Mono', Consolas, 'Fira Code', monospace;
        font-size: 16px;
        fill: #d9cbce;
        letter-spacing: 0.08em;
      }
      .cursor {
        fill: #8b111a;
        animation: blink 0.8s infinite;
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      
      /* Phase 1 */
      @keyframes line1 {
        0% { opacity: 1; }
        30% { opacity: 1; }
        33% { opacity: 0; }
        100% { opacity: 0; }
      }
      /* Phase 2 */
      @keyframes line2 {
        0%, 33% { opacity: 0; }
        36% { opacity: 1; }
        63% { opacity: 1; }
        66% { opacity: 0; }
        100% { opacity: 0; }
      }
      /* Phase 3 */
      @keyframes line3 {
        0%, 66% { opacity: 0; }
        69% { opacity: 1; }
        97% { opacity: 1; }
        100% { opacity: 0; }
      }

      .text-p1 { animation: line1 12s infinite; }
      .text-p2 { animation: line2 12s infinite; }
      .text-p3 { animation: line3 12s infinite; }
    </style>
  </defs>

  <g transform="translate(425, 36)" text-anchor="middle">
    <!-- Line 1 -->
    <g class="text-p1">
      <text x="0" y="0" class="mono-text">architect for failure <tspan fill="#8b111a">|</tspan> eliminate flakiness <tspan fill="#8b111a">|</tspan> scale reliability<tspan class="cursor">_</tspan></text>
    </g>
    
    <!-- Line 2 -->
    <g class="text-p2">
      <text x="0" y="0" class="mono-text">SDET-1 @ Infinite Locus <tspan fill="#8b111a">•</tspan> Cloud Infrastructure (AWS / Azure)<tspan class="cursor">_</tspan></text>
    </g>

    <!-- Line 3 -->
    <g class="text-p3">
      <text x="0" y="0" class="mono-text">deterministic test automation <tspan fill="#8b111a">→</tspan> serverless telemetry <tspan fill="#8b111a">→</tspan> zero-defect deploy<tspan class="cursor">_</tspan></text>
    </g>
  </g>
</svg>
