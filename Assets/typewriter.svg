<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 50" width="100%" height="50">
  <defs>
    <!-- ClipPaths for true left-to-right typing effect -->
    <clipPath id="typeClip1">
      <rect x="0" y="0" height="50" width="0">
        <animate attributeName="width" 
          values="0; 0; 780; 780; 0; 0" 
          keyTimes="0; 0.02; 0.16; 0.28; 0.33; 1" 
          dur="12s" 
          repeatCount="indefinite" />
      </rect>
    </clipPath>

    <clipPath id="typeClip2">
      <rect x="0" y="0" height="50" width="0">
        <animate attributeName="width" 
          values="0; 0; 720; 720; 0; 0" 
          keyTimes="0; 0.35; 0.50; 0.62; 0.66; 1" 
          dur="12s" 
          repeatCount="indefinite" />
      </rect>
    </clipPath>

    <clipPath id="typeClip3">
      <rect x="0" y="0" height="50" width="0">
        <animate attributeName="width" 
          values="0; 0; 800; 800; 0; 0" 
          keyTimes="0; 0.68; 0.83; 0.95; 0.99; 1" 
          dur="12s" 
          repeatCount="indefinite" />
      </rect>
    </clipPath>

    <style>
      .mono-code {
        font-family: 'JetBrains Mono', 'SF Mono', Consolas, 'Fira Code', monospace;
        font-size: 15px;
        fill: #d9cbce;
        letter-spacing: 0.06em;
      }
      .cursor-blink {
        animation: blinkCursor 0.7s infinite;
      }
      @keyframes blinkCursor {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
    </style>
  </defs>

  <!-- Centered Base Group -->
  <g transform="translate(425, 30)" text-anchor="middle">
    
    <!-- Phrase 1 (0s to 4s) -->
    <g>
      <animate attributeName="opacity" values="1; 1; 0; 0" keyTimes="0; 0.32; 0.34; 1" dur="12s" repeatCount="indefinite" />
      <g transform="translate(-390, 0)">
        <g clip-path="url(#typeClip1)">
          <text x="0" y="0" class="mono-code" text-anchor="start">architect for failure <tspan fill="#e62842">|</tspan> eliminate flakiness <tspan fill="#e62842">|</tspan> scale reliability<tspan fill="#e62842" class="cursor-blink">_</tspan></text>
        </g>
      </g>
    </g>

    <!-- Phrase 2 (4s to 8s) -->
    <g>
      <animate attributeName="opacity" values="0; 0; 1; 1; 0; 0" keyTimes="0; 0.34; 0.35; 0.65; 0.67; 1" dur="12s" repeatCount="indefinite" />
      <g transform="translate(-340, 0)">
        <g clip-path="url(#typeClip2)">
          <text x="0" y="0" class="mono-code" text-anchor="start">SDET-1 @ Infinite Locus <tspan fill="#e62842">•</tspan> Cloud Infrastructure (AWS / Azure)<tspan fill="#e62842" class="cursor-blink">_</tspan></text>
        </g>
      </g>
    </g>

    <!-- Phrase 3 (8s to 12s) -->
    <g>
      <animate attributeName="opacity" values="0; 0; 1; 1; 0" keyTimes="0; 0.67; 0.68; 0.98; 1" dur="12s" repeatCount="indefinite" />
      <g transform="translate(-400, 0)">
        <g clip-path="url(#typeClip3)">
          <text x="0" y="0" class="mono-code" text-anchor="start">deterministic test automation <tspan fill="#e62842">→</tspan> serverless telemetry <tspan fill="#e62842">→</tspan> zero-defect deploy<tspan fill="#e62842" class="cursor-blink">_</tspan></text>
        </g>
      </g>
    </g>

  </g>
</svg>
