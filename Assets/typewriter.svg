<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 50" width="850" height="50">
  <defs>
    <!-- Root-level absolute clipping paths (0 to 850px width, full 50px height) -->
    <clipPath id="clipRect1">
      <rect id="typeRect1" x="0" y="0" width="0" height="50" />
    </clipPath>
    <clipPath id="clipRect2">
      <rect id="typeRect2" x="0" y="0" width="0" height="50" />
    </clipPath>
    <clipPath id="clipRect3">
      <rect id="typeRect3" x="0" y="0" width="0" height="50" />
    </clipPath>

    <style>
      .mono-text {
        font-family: 'JetBrains Mono', 'SF Mono', Consolas, 'Courier New', monospace;
        font-size: 15.5px;
        font-weight: 600;
        fill: #f0ecec;
        letter-spacing: 0.06em;
      }
      .cursor-blink {
        animation: blink 0.7s infinite;
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }

      /* CSS animations driving root clipping rectangles */
      @keyframes animRect1 {
        0% { width: 0px; }
        2% { width: 0px; }
        15% { width: 850px; }
        27% { width: 850px; }
        33% { width: 0px; }
        34%, 100% { width: 0px; }
      }
      @keyframes animRect2 {
        0%, 33% { width: 0px; }
        35% { width: 0px; }
        48% { width: 850px; }
        60% { width: 850px; }
        66% { width: 0px; }
        67%, 100% { width: 0px; }
      }
      @keyframes animRect3 {
        0%, 66% { width: 0px; }
        68% { width: 0px; }
        81% { width: 850px; }
        93% { width: 850px; }
        99% { width: 0px; }
        100% { width: 0px; }
      }

      @keyframes fadeGroup1 {
        0%, 33% { opacity: 1; visibility: visible; }
        34%, 100% { opacity: 0; visibility: hidden; }
      }
      @keyframes fadeGroup2 {
        0%, 33% { opacity: 0; visibility: hidden; }
        34%, 66% { opacity: 1; visibility: visible; }
        67%, 100% { opacity: 0; visibility: hidden; }
      }
      @keyframes fadeGroup3 {
        0%, 66% { opacity: 0; visibility: hidden; }
        67%, 99% { opacity: 1; visibility: visible; }
        100% { opacity: 0; visibility: hidden; }
      }

      #typeRect1 { animation: animRect1 12s infinite; }
      #typeRect2 { animation: animRect2 12s infinite; }
      #typeRect3 { animation: animRect3 12s infinite; }

      .grp-1 { animation: fadeGroup1 12s infinite; }
      .grp-2 { animation: fadeGroup2 12s infinite; }
      .grp-3 { animation: fadeGroup3 12s infinite; }
    </style>
  </defs>

  <!-- Line 1 (0s to 4s) -->
  <g class="grp-1" clip-path="url(#clipRect1)">
    <text x="425" y="32" text-anchor="middle" class="mono-text">architect for failure <tspan fill="#e62842">|</tspan> eliminate flakiness <tspan fill="#e62842">|</tspan> scale reliability<tspan fill="#e62842" class="cursor-blink">_</tspan></text>
  </g>

  <!-- Line 2 (4s to 8s) -->
  <g class="grp-2" clip-path="url(#clipRect2)">
    <text x="425" y="32" text-anchor="middle" class="mono-text">SDET-1 @ Infinite Locus <tspan fill="#e62842">•</tspan> Cloud Infrastructure (AWS / Azure)<tspan fill="#e62842" class="cursor-blink">_</tspan></text>
  </g>

  <!-- Line 3 (8s to 12s) -->
  <g class="grp-3" clip-path="url(#clipRect3)">
    <text x="425" y="32" text-anchor="middle" class="mono-text">deterministic test automation <tspan fill="#e62842">→</tspan> serverless telemetry <tspan fill="#e62842">→</tspan> zero-defect deploy<tspan fill="#e62842" class="cursor-blink">_</tspan></text>
  </g>
</svg>
