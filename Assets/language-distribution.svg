<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 230" width="100%" height="100%">
  <defs>
    <linearGradient id="langCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090608" />
      <stop offset="100%" stop-color="#140609" />
    </linearGradient>
    <linearGradient id="langBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a0404" />
      <stop offset="50%" stop-color="#8b111a" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#240205" />
    </linearGradient>
    <style>
      .mono { font-family: 'JetBrains Mono', 'SF Mono', Consolas, monospace; }
      .sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="540" height="230" rx="10" fill="url(#langCardBg)" />
  <rect x="1" y="1" width="538" height="228" rx="9" fill="none" stroke="url(#langBorder)" stroke-width="1.2" />

  <!-- Header -->
  <g transform="translate(24, 26)">
    <circle cx="4" cy="4" r="4" fill="#8b111a" />
    <text x="18" y="8" fill="#d9cbce" font-size="12" font-weight="700" class="mono" letter-spacing="0.15em">LANGUAGE COMPOSITION</text>
    <text x="490" y="8" fill="#6e5c5f" font-size="10" font-weight="600" class="mono" text-anchor="end">CODEBASE METRICS</text>
    <line x1="0" y1="18" x2="492" y2="18" stroke="#380408" stroke-width="1" />
  </g>

  <!-- Language Rows with High-Contrast Distinguishable Colors -->
  <g transform="translate(24, 62)">
    <!-- 1. Python (45.0% - Rich Crimson Red) -->
    <g transform="translate(0, 0)">
      <circle cx="4" cy="8" r="3.5" fill="#d12438" />
      <text x="14" y="12" fill="#ffffff" font-size="11.5" font-weight="700" class="mono">Python</text>
      <text x="490" y="12" fill="#f0a8b2" font-size="11.5" font-weight="700" class="mono" text-anchor="end">45.0%</text>
      <rect x="0" y="18" width="490" height="7" rx="3.5" fill="#1c0a0e" stroke="#381016" stroke-width="0.8" />
      <rect x="0" y="18" width="220" height="7" rx="3.5" fill="#d12438" />
    </g>

    <!-- 2. JavaScript (25.0% - Warm Amber Gold) -->
    <g transform="translate(0, 32)">
      <circle cx="4" cy="8" r="3.5" fill="#d4962b" />
      <text x="14" y="12" fill="#ffffff" font-size="11.5" font-weight="700" class="mono">JavaScript</text>
      <text x="490" y="12" fill="#ffd88a" font-size="11.5" font-weight="700" class="mono" text-anchor="end">25.0%</text>
      <rect x="0" y="18" width="490" height="7" rx="3.5" fill="#1c0a0e" stroke="#381016" stroke-width="0.8" />
      <rect x="0" y="18" width="122" height="7" rx="3.5" fill="#d4962b" />
    </g>

    <!-- 3. Java (15.0% - Warm Terracotta Coral) -->
    <g transform="translate(0, 64)">
      <circle cx="4" cy="8" r="3.5" fill="#c75a36" />
      <text x="14" y="12" fill="#ffffff" font-size="11.5" font-weight="700" class="mono">Java</text>
      <text x="490" y="12" fill="#ffaa88" font-size="11.5" font-weight="700" class="mono" text-anchor="end">15.0%</text>
      <rect x="0" y="18" width="490" height="7" rx="3.5" fill="#1c0a0e" stroke="#381016" stroke-width="0.8" />
      <rect x="0" y="18" width="73" height="7" rx="3.5" fill="#c75a36" />
    </g>

    <!-- 4. Shell / Bash (10.0% - Jade Forest Green) -->
    <g transform="translate(0, 96)">
      <circle cx="4" cy="8" r="3.5" fill="#3fa366" />
      <text x="14" y="12" fill="#ffffff" font-size="11.5" font-weight="700" class="mono">Shell / Bash</text>
      <text x="490" y="12" fill="#9de0b4" font-size="11.5" font-weight="700" class="mono" text-anchor="end">10.0%</text>
      <rect x="0" y="18" width="490" height="7" rx="3.5" fill="#1c0a0e" stroke="#381016" stroke-width="0.8" />
      <rect x="0" y="18" width="49" height="7" rx="3.5" fill="#3fa366" />
    </g>

    <!-- 5. SQL & Others (5.0% - Soft Slate Steel Blue) -->
    <g transform="translate(0, 128)">
      <circle cx="4" cy="8" r="3.5" fill="#6d7ca8" />
      <text x="14" y="12" fill="#ffffff" font-size="11.5" font-weight="700" class="mono">SQL &amp; Others</text>
      <text x="490" y="12" fill="#b4bfdf" font-size="11.5" font-weight="700" class="mono" text-anchor="end">5.0%</text>
      <rect x="0" y="18" width="490" height="7" rx="3.5" fill="#1c0a0e" stroke="#381016" stroke-width="0.8" />
      <rect x="0" y="18" width="24" height="7" rx="3.5" fill="#6d7ca8" />
    </g>
  </g>
</svg>
