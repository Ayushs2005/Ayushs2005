<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 90" width="100%" height="90">
  <defs>
    <linearGradient id="tileBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e0a10" />
      <stop offset="100%" stop-color="#100407" />
    </linearGradient>
    <linearGradient id="tileBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b111a" />
      <stop offset="100%" stop-color="#3d050c" />
    </linearGradient>
    <filter id="tileGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <g transform="translate(10, 10)">
    <!-- Tile 1: Python -->
    <g transform="translate(0, 0)" filter="url(#tileGlow)">
      <rect width="68" height="68" rx="18" fill="url(#tileBg)" stroke="url(#tileBorder)" stroke-width="1.5" />
      <g transform="translate(18, 18) scale(0.66)">
        <!-- Python Logo -->
        <path d="M23.5 0C10.7 0 11.5 5.5 11.5 5.5l.01 5.7h12.2v1.7H6.9S0 12.1 0 24.9c0 12.8 6 12.3 6 12.3h3.6v-5.1s-.2-6.1 6-6.1h10.4s5.8.1 5.8-5.7V6.2S32.6 0 23.5 0zM18 3.7c1.2 0 2.2 1 2.2 2.2s-1 2.2-2.2 2.2-2.2-1-2.2-2.2 1-2.2 2.2-2.2z" fill="#387EB8"/>
        <path d="M24.5 48c12.8 0 12-5.5 12-5.5l-.01-5.7H24.3v-1.7h16.8s6.9.8 6.9-12c0-12.8-6-12.3-6-12.3h-3.6v5.1s.2 6.1-6 6.1H28s-5.8-.1-5.8 5.7v14.4s-.8 6.2 8.3 6.2zm5.5-3.7c-1.2 0-2.2-1-2.2-2.2s1-2.2 2.2-2.2 2.2 1 2.2 2.2-1 2.2-2.2 2.2z" fill="#FFE052"/>
      </g>
    </g>

    <!-- Tile 2: Playwright -->
    <g transform="translate(82, 0)" filter="url(#tileGlow)">
      <rect width="68" height="68" rx="18" fill="url(#tileBg)" stroke="url(#tileBorder)" stroke-width="1.5" />
      <g transform="translate(19, 18) scale(0.65)">
        <!-- Playwright Mask Logo -->
        <path d="M36.7 13.5c-4.4-6.3-12.6-7.8-19-3.4S9.9 22.7 14.3 29c3.8 5.4 10.4 7.2 16.2 4.4l4.2 8.8c.6 1.2 2 1.7 3.2 1.1 1.2-.6 1.7-2 1.1-3.2l-4.2-8.8c2.6-4.9 2.5-11.4-1.9-17.8z" fill="#2EAD33"/>
        <path d="M19.3 11.5c-4.4-6.3-12.6-7.8-19-3.4S-7.5 20.7-3.1 27c3.8 5.4 10.4 7.2 16.2 4.4l4.2 8.8c.6 1.2 2 1.7 3.2 1.1 1.2-.6 1.7-2 1.1-3.2l-4.2-8.8c2.6-4.9 2.6-11.4-1.9-17.8z" fill="#E23237" transform="translate(12, 2) scale(0.9)"/>
      </g>
    </g>

    <!-- Tile 3: AWS -->
    <g transform="translate(164, 0)" filter="url(#tileGlow)">
      <rect width="68" height="68" rx="18" fill="url(#tileBg)" stroke="url(#tileBorder)" stroke-width="1.5" />
      <g transform="translate(16, 24) scale(0.75)">
        <!-- AWS Logo -->
        <text x="24" y="14" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="900" font-size="14" text-anchor="middle" letter-spacing="1">aws</text>
        <path d="M4 22 C14 28, 34 28, 44 22" fill="none" stroke="#FF9900" stroke-width="2.2" stroke-linecap="round"/>
        <path d="M41 20 L45 22 L42 25" fill="#FF9900"/>
      </g>
    </g>

    <!-- Tile 4: Azure -->
    <g transform="translate(246, 0)" filter="url(#tileGlow)">
      <rect width="68" height="68" rx="18" fill="url(#tileBg)" stroke="url(#tileBorder)" stroke-width="1.5" />
      <g transform="translate(19, 18) scale(0.68)">
        <!-- Azure Logo -->
        <path d="M16 2 L2 28 L14 44 L30 44 L44 18 Z" fill="#0078D4"/>
        <path d="M22 2 L44 44 L32 44 L16 14 Z" fill="#50E6FF" opacity="0.8"/>
      </g>
    </g>

    <!-- Tile 5: Docker -->
    <g transform="translate(328, 0)" filter="url(#tileGlow)">
      <rect width="68" height="68" rx="18" fill="url(#tileBg)" stroke="url(#tileBorder)" stroke-width="1.5" />
      <g transform="translate(17, 20) scale(0.7)">
        <!-- Docker Whale -->
        <rect x="12" y="10" width="5" height="5" rx="1" fill="#2496ED"/>
        <rect x="18" y="10" width="5" height="5" rx="1" fill="#2496ED"/>
        <rect x="24" y="10" width="5" height="5" rx="1" fill="#2496ED"/>
        <rect x="18" y="4" width="5" height="5" rx="1" fill="#2496ED"/>
        <rect x="24" y="4" width="5" height="5" rx="1" fill="#2496ED"/>
        <path d="M45 16c-1 0-3 1-4 2-3-2-8-2-12-1l-1 1v7c0 4 3 8 8 8h15c5 0 9-4 9-9 0-4-3-7-7-8-3 0-5 0-8 0z" fill="#2496ED"/>
      </g>
    </g>

    <!-- Tile 6: Java -->
    <g transform="translate(410, 0)" filter="url(#tileGlow)">
      <rect width="68" height="68" rx="18" fill="url(#tileBg)" stroke="url(#tileBorder)" stroke-width="1.5" />
      <g transform="translate(20, 16) scale(0.68)">
        <!-- Java Cup -->
        <path d="M12 28c0 4 10 4 16 0 5-3-16-6-16 0z" fill="#5382A1"/>
        <path d="M10 34c0 3 14 3 20 0 5-2-20-5-20 0z" fill="#E76F00"/>
        <path d="M22 6c4 4-2 8-2 12 0 4 6 6 6 10-6 0-10-4-10-8s6-8 6-14z" fill="#E76F00" opacity="0.9"/>
        <path d="M16 8c3 3-1 6-1 9 0 3 4 5 4 8-4 0-7-3-7-6s4-6 4-11z" fill="#5382A1" opacity="0.9"/>
      </g>
    </g>

    <!-- Tile 7: MongoDB -->
    <g transform="translate(492, 0)" filter="url(#tileGlow)">
      <rect width="68" height="68" rx="18" fill="url(#tileBg)" stroke="url(#tileBorder)" stroke-width="1.5" />
      <g transform="translate(21, 16) scale(0.7)">
        <!-- MongoDB Leaf -->
        <path d="M20 2C19 2 13 8 13 18c0 9 6 15 7 19 1-4 7-10 7-19 0-10-6-16-7-16z" fill="#47A248"/>
        <path d="M20 2v35c1-4 7-10 7-19 0-10-6-16-7-16z" fill="#499D4A" opacity="0.8"/>
        <path d="M20 37c-1 0-2 2-2 3 1 2 2 4 2 4s1-2 2-4c0-1-1-3-2-3z" fill="#3FA037"/>
      </g>
    </g>

    <!-- Tile 8: MySQL -->
    <g transform="translate(574, 0)" filter="url(#tileGlow)">
      <rect width="68" height="68" rx="18" fill="url(#tileBg)" stroke="url(#tileBorder)" stroke-width="1.5" />
      <g transform="translate(17, 20) scale(0.72)">
        <!-- MySQL Dolphin -->
        <path d="M35 12c-5-6-14-5-19 0-3 3-5 7-5 11 0 4 3 8 7 9 6 2 13 0 17-5 3-3 4-7 4-11 0-2-2-3-4-4z" fill="#00758F"/>
        <path d="M26 18c-3-2-7-1-9 1-2 2-2 5 0 7 2 2 6 2 8 0 2-2 2-6 1-8z" fill="#F29111"/>
      </g>
    </g>

    <!-- Tile 9: Linux / Bash -->
    <g transform="translate(656, 0)" filter="url(#tileGlow)">
      <rect width="68" height="68" rx="18" fill="url(#tileBg)" stroke="url(#tileBorder)" stroke-width="1.5" />
      <g transform="translate(19, 20) scale(0.7)">
        <!-- Terminal Bash -->
        <rect width="42" height="34" rx="6" fill="#000000" stroke="#8b111a" stroke-width="1.5"/>
        <path d="M8 12 L16 17 L8 22" fill="none" stroke="#4AF626" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <line x1="20" y1="22" x2="30" y2="22" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
      </g>
    </g>

    <!-- Tile 10: Postman -->
    <g transform="translate(738, 0)" filter="url(#tileGlow)">
      <rect width="68" height="68" rx="18" fill="url(#tileBg)" stroke="url(#tileBorder)" stroke-width="1.5" />
      <g transform="translate(18, 17) scale(0.7)">
        <!-- Postman Logo -->
        <circle cx="23" cy="23" r="19" fill="#FF6C37"/>
        <path d="M12 25 L21 16 L25 20 L16 29 Z" fill="#ffffff"/>
        <path d="M23 14 L31 22 L27 26 L19 18 Z" fill="#ffffff" opacity="0.8"/>
      </g>
    </g>

    <!-- Tile 11: Git -->
    <g transform="translate(820, 0)" filter="url(#tileGlow)">
      <rect width="68" height="68" rx="18" fill="url(#tileBg)" stroke="url(#tileBorder)" stroke-width="1.5" />
      <g transform="translate(18, 17) scale(0.7)">
        <!-- Git Branching Node Logo -->
        <rect x="6" y="6" width="32" height="32" rx="6" fill="#F05032" transform="rotate(45 22 22)"/>
        <circle cx="15" cy="22" r="3.5" fill="#ffffff"/>
        <circle cx="29" cy="15" r="3.5" fill="#ffffff"/>
        <circle cx="29" cy="29" r="3.5" fill="#ffffff"/>
        <path d="M15 22 L29 15 M15 22 L29 29" stroke="#ffffff" stroke-width="2"/>
      </g>
    </g>
