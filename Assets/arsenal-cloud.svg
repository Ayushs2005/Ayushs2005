<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 140" width="100%" height="100%">
  <defs>
    <linearGradient id="cBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080507" />
      <stop offset="100%" stop-color="#120508" />
    </linearGradient>
    <linearGradient id="cBrd" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a0404" />
      <stop offset="100%" stop-color="#1c0204" />
    </linearGradient>
    <style>
      .mono { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Mono', Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    </style>
  </defs>

  <rect width="540" height="140" rx="8" fill="url(#cBg)" />
  <rect x="1" y="1" width="538" height="138" rx="7" fill="none" stroke="url(#cBrd)" stroke-width="1.2" />

  <!-- Category Title -->
  <g transform="translate(20, 26)">
    <!-- Icon -->
    <path d="M 0 10 C 0 6, 4 2, 9 2 C 12 2, 14 3, 16 6 C 18 3, 22 2, 26 5 C 29 7, 30 11, 29 14 C 32 15, 34 18, 33 21 C 32 24, 29 26, 26 26 L 6 26 C 2 26, 0 23, 0 19 Z" fill="none" stroke="#8b111a" stroke-width="1.5" />
    <text x="44" y="18" fill="#e8dadc" font-size="13" font-weight="700" class="mono" letter-spacing="0.12em">CLOUD ARCHITECTURE</text>
    <text x="495" y="18" fill="#665053" font-size="10" class="mono" text-anchor="end">INFRASTRUCTURE</text>
    <line x1="0" y1="32" x2="500" y2="32" stroke="#2b0306" stroke-width="1" />
  </g>

  <!-- Badges / Items -->
  <g transform="translate(20, 78)">
    <!-- AWS -->
    <g transform="translate(0, 0)">
      <rect width="115" height="38" rx="6" fill="#170508" stroke="#4a0404" stroke-width="1" />
      <text x="57" y="18" fill="#ffffff" font-size="11.5" font-weight="700" class="sans" text-anchor="middle">AWS</text>
      <text x="57" y="30" fill="#9e8588" font-size="9" class="mono" text-anchor="middle">Lambda · SNS · S3</text>
    </g>

    <!-- Azure -->
    <g transform="translate(125, 0)">
      <rect width="125" height="38" rx="6" fill="#170508" stroke="#4a0404" stroke-width="1" />
      <text x="62" y="18" fill="#ffffff" font-size="11.5" font-weight="700" class="sans" text-anchor="middle">Microsoft Azure</text>
      <text x="62" y="30" fill="#9e8588" font-size="9" class="mono" text-anchor="middle">AZ-104 Certified</text>
    </g>

    <!-- Serverless -->
    <g transform="translate(260, 0)">
      <rect width="115" height="38" rx="6" fill="#170508" stroke="#4a0404" stroke-width="1" />
      <text x="57" y="18" fill="#ffffff" font-size="11.5" font-weight="700" class="sans" text-anchor="middle">CloudWatch</text>
      <text x="57" y="30" fill="#9e8588" font-size="9" class="mono" text-anchor="middle">Telemetry &amp; Logs</text>
    </g>

    <!-- Serverless Arch -->
    <g transform="translate(385, 0)">
      <rect width="115" height="38" rx="6" fill="#170508" stroke="#4a0404" stroke-width="1" />
      <text x="57" y="18" fill="#ffffff" font-size="11.5" font-weight="700" class="sans" text-anchor="middle">Serverless</text>
      <text x="57" y="30" fill="#9e8588" font-size="9" class="mono" text-anchor="middle">Event-Driven</text>
    </g>
  </g>
</svg>
